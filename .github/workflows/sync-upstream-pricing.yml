name: Sync Upstream Pricing Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and merge upstream pricing fields only
        run: |
          node - <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';

          const UPSTREAM_URL = 'https://raw.githubusercontent.com/yuhuan-dev/antigravity-usage-monitor/main/pricing-catalog.json';
          const TARGET_PATH = 'pricing-catalog.json';

          const local = JSON.parse(readFileSync(TARGET_PATH, 'utf8'));
          const res = await fetch(UPSTREAM_URL, { headers: { 'User-Agent': 'agy-monitor-pricing-sync' } });
          if (!res.ok) {
            throw new Error(`Failed to fetch upstream pricing-catalog.json: HTTP ${res.status}`);
          }
          const upstream = await res.json();

          if (!upstream || typeof upstream !== 'object' || !upstream.pricing || typeof upstream.pricing !== 'object') {
            throw new Error('Upstream pricing-catalog.json is missing valid pricing object');
          }

          // Preserve local release identity and update URLs while pulling only pricing metadata
          const merged = {
            ...local,
            ...(typeof upstream.schemaVersion === 'number' ? { schemaVersion: upstream.schemaVersion } : {}),
            ...(typeof upstream.catalogVersion === 'string' ? { catalogVersion: upstream.catalogVersion } : {}),
            ...(typeof upstream.updatedAt === 'string' ? { updatedAt: upstream.updatedAt } : {}),
            ...(upstream.placeholders && typeof upstream.placeholders === 'object' ? { placeholders: upstream.placeholders } : {}),
            pricing: upstream.pricing,
          };

          const nextText = `${JSON.stringify(merged, null, 2)}\n`;
          const prevText = readFileSync(TARGET_PATH, 'utf8');
          if (nextText === prevText) {
            console.log('pricing-catalog.json is already up to date.');
          } else {
            writeFileSync(TARGET_PATH, nextText, 'utf8');
            console.log(`Updated pricing-catalog.json to catalogVersion=${merged.catalogVersion}`);
          }
          EOF

      - name: Verify pricing catalog and update tests
        working-directory: sidecars/panel
        run: node --test test/cloud-sync-and-update.test.mjs

      - name: Commit and push if pricing changed
        run: |
          if git diff --quiet -- pricing-catalog.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing-catalog.json
          git commit -m "chore: sync upstream pricing catalog"
          git push
